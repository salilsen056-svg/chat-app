services:
  - type: web
    name: salil-hello-chat
    runtime: node
    repo: https://github.com/salilsen056-svg/chat-app
    branch: main
    rootDir: chat-app
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: salil-hello-chat-db
          property: connectionString

databases:
  - name: salil-hello-chat-db
    databaseName: hello_chat
    user: hello_chat
    region: singapore
    plan: free
    ipAllowList: []
